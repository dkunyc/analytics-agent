# The headless ask command reads headless_workflow.
# LibreChat is a separate process and is not started here.
# This file does not create a shared trace with LibreChat.

headless_workflow:
  status: ask
  model_client: openrouter_or_offline
  # OpenAI-compatible chat completions. The client does not call LibreChat.
  model_api: openai_compatible
  openrouter_base_url: https://openrouter.ai/api/v1
  openrouter_key_env: OPENROUTER_KEY
  openrouter_model_env: OPENROUTER_MODEL
  # Used when OPENROUTER_MODEL is unset. The offline provider does not call it.
  model: "openai/gpt-4o-mini"
  provider_env: AGENT_PROVIDER
  sql_row_limit: 200
  sql_timeout_ms: 5000
  sql_max_bytes: 50000
  openrouter_timeout_s: 60
  langfuse_timeout_s: 5
  trace_path: traces/ask.jsonl

librechat_v1:
  status: planned_not_deployed
  # LibreChat's documented OpenRouter variable. Not OPENROUTER_API_KEY.
  openrouter_key_env: OPENROUTER_KEY
  openrouter_base_url: https://openrouter.ai/api/v1
  code_interpreter_baseurl_env: LIBRECHAT_CODE_BASEURL
  langfuse_public_key_env: LANGFUSE_PUBLIC_KEY
  langfuse_secret_key_env: LANGFUSE_SECRET_KEY
  langfuse_base_url_env: LANGFUSE_BASE_URL
  otel_tracing_enabled_env: OTEL_TRACING_ENABLED
  otel_endpoint_env: OTEL_EXPORTER_OTLP_ENDPOINT
  rum_enabled_env: RUM_ENABLED

execution_adapter:
  # Planned code runs in the separate Code Interpreter service, not on the user machine.
  kind: remote_sandbox
  host_filesystem: not_granted
  deployed: false

browser_monitoring:
  interpretation: pending
  intended: frontend_errors_performance_and_request_correlation
  session_replay: off
  console_capture: off
  advanced_network_capture: off
  captures_prompts_by_default: false

provider_account:
  # Future OpenRouter account settings. Not enabled. Not verified by this repo.
  zero_data_retention: not_configured
  key_spend_cap: not_configured

traces:
  # Local JSONL always. Langfuse OTLP only when the three LANGFUSE_* variables are set.
  headless_workflow: local_jsonl_and_optional_langfuse
  librechat_langfuse: not_connected
  librechat_backend_otel: not_connected
  librechat_browser_rum: not_connected
  shared_end_to_end_span: false
